# Kept only as the pre-suspend guard. Idle detection, the screensaver, display
# blanking and the lock timers now live in the shell; this file is what still
# asks the shell to lock before logind suspends.
#
# No listeners: hypridle with a listener would be a second idle stack, and the
# shell's IdleMonitor already respects the stay-awake inhibitor.
#
# hypridle runs every action through `/bin/sh -c`; the quickshell path is
# substituted rather than left to PATH because the daemon runs from the user
# manager.
general {
  before_sleep_cmd = @QUICKSHELL@ ipc call lock lock
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
