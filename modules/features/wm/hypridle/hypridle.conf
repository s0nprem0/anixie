# Blanks the display after 5 minutes idle, locks the session after 10.
#
# The daemon itself is enabled in modules/system/lock.nix; this file only
# supplies its configuration, which no NixOS module owns.
#
# Actions are Lua dispatchers. The config manager is Lua (configType = "lua"),
# which rewrites `hyprctl dispatch dpms off` into `hl.dispatch(dpms off)` before
# evaluating it -- and `dpms off` is not a Lua expression, so every DPMS
# transition failed with "')' expected near 'off'". `hl.dispatch` also rejects a
# bare string: it wants a dispatcher, which is what `hl.dsp.dpms` returns.
general {
  # pidof guard avoids stacking a second instance if a lock is already up.
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hl.dsp.dpms({action = "on"})
}

listener {
  timeout = 300
  on-timeout = hl.dsp.dpms({action = "off"})
  on-resume = hl.dsp.dpms({action = "on"})
}

listener {
  timeout = 600
  on-timeout = loginctl lock-session
}