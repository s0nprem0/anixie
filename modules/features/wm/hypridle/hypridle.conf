# Blanks the display after 5 minutes idle, locks the session after 10.
#
# The daemon itself is enabled in modules/system/lock.nix; this file only
# supplies its configuration, which no NixOS module owns.
#
# Actions are hyprctl's hyphenated dispatcher form. The Lua form
# (`hl.dsp.dpms({action = "off"})`) that upstream ships does not work here:
# `hyprctl eval` is rejected under the hyprlang config manager, and
# `hyprctl dispatch` only accepts hyphenated keywords.
general {
  # pidof guard avoids stacking a second instance if a lock is already up.
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
  timeout = 300
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

listener {
  timeout = 600
  on-timeout = loginctl lock-session
}