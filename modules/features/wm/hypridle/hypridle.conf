# Blanks the display after 5 minutes idle, locks the session after 10, and
# suspends after 30 on battery.
#
# The daemon itself is enabled in modules/system/lock.nix; this file only
# supplies its configuration, which no NixOS module owns.
#
# hypridle runs every action through `/bin/sh -c`; it does not evaluate Lua.
# Hyprland's config is Lua (configType = "lua"), so a DPMS dispatcher has to go
# through `hyprctl dispatch` with the Lua expression quoted. A bare
# `hl.dsp.dpms({action = "off"})` is not shell syntax: it fails with
# "syntax error near unexpected token `{action'", so no DPMS transition ran.
general {
  # pidof guard avoids stacking a second instance if a lock is already up.
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
  timeout = 300
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
  timeout = 600
  on-timeout = loginctl lock-session
}

# On mains the machine may be compiling, downloading or serving something, so
# only battery idle suspends. The helper exits early when an AC supply reports
# online; see modules/features/wm/hypridle/default.nix.
listener {
  timeout = 1800
  on-timeout = @SUSPEND@
}
