# mpv configuration rendered by anixie theme. Do not edit; edit the template.

osd-color=@FG@
osd-border-color=@BG_DARK@
osd-back-color=@BG@
osd-shadow-color=@BG_DARK@

sub-color=@FG@
sub-border-color=@BG_DARK@
sub-back-color=@BG@

# OSC (on-screen controller) tinted to the palette
osc-color=@PRIMARY@
osc-title-text-color=@FG@
osc-seekbar-size=8
osc-seekbar-style=bar
osc-border-size=1
osc-scale=0.8
osc-hidetimeout=2000

# Terminal/OSD font
osd-font="Iosevka Nerd Font"
osd-font-size=24
