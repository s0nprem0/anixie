background {
  monitor=
  blur_passes=3
  blur_size=8
  color=@BG_RGBA_F2@
  path=screenshot
}

input-field {
  monitor=
  size=320, 52
  capslock_color=@ACCENT_ALT_RGBA_FF@
  check_color=@SUCCESS_RGBA_FF@
  dots_size=0.250000
  dots_spacing=0.400000
  fade_on_empty=false
  fail_color=@DANGER_RGBA_FF@
  font_color=@FG_RGBA_FF@
  inner_color=@SURFACE_RGBA_FF@
  outer_color=@BG_RGBA_FF@
  outline_thickness=2
  placeholder_text=
  rounding=0
}

label {
  monitor=
  color=@FG_RGBA_FF@
  font_family=JetBrainsMono Nerd Font
  font_size=72
  halign=center
  position=0, 120
  text=$TIME
  valign=center
}

label {
  monitor=
  color=@MUTED_RGBA_FF@
  font_family=JetBrainsMono Nerd Font
  font_size=18
  halign=center
  position=0, 60
  text=cmd[update:60000] date +"%A, %d %B"
  valign=center
}
